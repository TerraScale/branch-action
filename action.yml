name: TerraScale database branch
description: Branch a TerraScale database for a pull request and delete the branch when the pull request closes.
author: TerraScale
branding:
  icon: git-branch
  color: green

inputs:
  api-key:
    description: TerraScale API key with databases:read and databases:write in the project. Pass it from a secret.
    required: true
  database:
    description: Database to branch, such as app.
    required: true
  branch:
    description: Name of the branch database, ^[a-z][a-z0-9_-]{0,62}$.
    default: pr-${{ github.event.pull_request.number }}
  command:
    description: >-
      create keeps an existing branch, reset branches the database again,
      delete removes the branch. Empty means delete when the pull request
      closed and create otherwise.
    default: ""
  project:
    description: Project id. Only an organization API key needs it; a project key acts in its own project.
    default: ""

outputs:
  name:
    description: Branch database name.
    value: ${{ steps.branch.outputs.name }}
  id:
    description: Branch database id; empty after delete.
    value: ${{ steps.branch.outputs.id }}
  project-id:
    description: Project id of the branch; empty after delete.
    value: ${{ steps.branch.outputs.project-id }}
  api-url:
    description: TerraScale API URL of the branch database; empty after delete.
    value: ${{ steps.branch.outputs.api-url }}

runs:
  using: composite
  steps:
    - name: Install ts
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/TerraScale/ts-go/v0.0.4/scripts/install.sh | sh -s 0.0.4
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - id: branch
      name: Branch the database
      shell: bash
      env:
        TERRASCALE_API_KEY: ${{ inputs.api-key }}
        DATABASE: ${{ inputs.database }}
        BRANCH: ${{ inputs.branch }}
        COMMAND: ${{ inputs.command }}
        PROJECT: ${{ inputs.project }}
        EVENT_ACTION: ${{ github.event.action }}
      run: '"$GITHUB_ACTION_PATH/branch.sh"'
