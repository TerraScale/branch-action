name: TerraScale database branch
description: Branch a TerraScale database for a pull request and delete the branch when the pull request closes.
author: TerraScale
branding:
  icon: git-branch
  color: green

inputs:
  api-key:
    description: TerraScale API key with database and document read/write scopes in the project. Pass it from a secret.
    required: true
  database:
    description: Database to branch, such as app.
    required: true
  branch:
    description: Namespace label, ^[a-z][a-z0-9_-]{0,62}$. The actual name also binds repository ID and PR number.
    default: preview
  command:
    description: >-
      create keeps the base preview, reset creates a new generation and retains
      previous databases, delete conditionally removes verified previews in this namespace.
      Empty means delete when the pull request
      closed and create otherwise.
    default: ""
  ttl:
    description: Branch lifetime on creation, from 60s to 365d. Existing previews keep their expiry.
    default: 7d
  project:
    description: Project id. Only an organization API key needs it; a project key acts in its own project.
    default: ""

outputs:
  connection-url:
    description: Secret Postgres URL with a read/write key scoped to the branch; empty after delete. Expires within seven days or with the branch.
    value: ${{ steps.branch.outputs.connection-url }}
  name:
    description: Branch database name.
    value: ${{ steps.branch.outputs.name }}
  id:
    description: Branch database id; empty after delete.
    value: ${{ steps.branch.outputs.id }}
  project-id:
    description: Project id of the branch; empty after delete.
    value: ${{ steps.branch.outputs.project-id }}
  api-url:
    description: TerraScale API URL of the branch database; empty after delete.
    value: ${{ steps.branch.outputs.api-url }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version: '1.27.4'
        cache: false
    - name: Install ts
      shell: bash
      run: |
        set -euo pipefail
        revision=a5cf8b1d97a730ee5c3cc18ddc751e37a21f1adf  # tag sdk/go/v0.0.27
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        git -C "$work" init --quiet
        git -C "$work" remote add origin https://github.com/TerraScale/terrascale.git
        git -C "$work" sparse-checkout set sdk/go
        git -C "$work" fetch --quiet --depth=1 --filter=blob:none origin "$revision"
        git -C "$work" checkout --quiet --detach FETCH_HEAD
        mkdir -p "$HOME/.local/bin"
        cd "$work/sdk/go"
        go build -mod=readonly -trimpath -o "$HOME/.local/bin/ts" ./cmd/ts
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - id: branch
      name: Branch the database
      shell: bash
      env:
        TERRASCALE_API_KEY: ${{ inputs.api-key }}
        DATABASE: ${{ inputs.database }}
        BRANCH: ${{ inputs.branch }}
        COMMAND: ${{ inputs.command }}
        PROJECT: ${{ inputs.project }}
        TTL: ${{ inputs.ttl }}
        EVENT_ACTION: ${{ github.event.action }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: '"$GITHUB_ACTION_PATH/branch.sh"'
