name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    uses: TerraScale/.github/.github/workflows/command.yml@3a54c0184eacdc45466c1123bca67a99db62e91c
    with:
      command: |
        python3 -m unittest discover -s tests -v
        shellcheck branch.sh
        curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
        echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint_1.7.7_linux_amd64.tar.gz" | sha256sum -c -
        tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
        ./actionlint -color .github/workflows/*.yml examples/*.yml
